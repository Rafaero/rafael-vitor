<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Rafael Vitor · Senior ServiceNow Consultant</title>
  <desc id="d">A navy night sky with a compass, a dotted route between drawn cities (mountains, a tower, a skyline, a pagoda, sails by the harbour, Sugarloaf with its cable car) and a small plane.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223d"/>
      <stop offset="1" stop-color="#22345a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E8F84"/>
      <stop offset="1" stop-color="#0A6B63"/>
    </linearGradient>
    <style>
      .name { font: 800 54px "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f6f0e1; }
      .role { font: 700 24px "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f2d06b; }
      .line { font: 400 18px "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #c9d3e6; }
      .twinkle { animation: tw 3.2s ease-in-out infinite; }
      .twinkle.b { animation-delay: 1.1s; }
      .twinkle.c { animation-delay: 2.2s; }
      @keyframes tw { 0%, 100% { opacity: .9 } 50% { opacity: .25 } }
      .plane { animation: fly 14s linear infinite; }
      @keyframes fly { from { offset-distance: 0% } to { offset-distance: 100% } }
      .needle { transform-origin: 170px 150px; animation: sway 6s ease-in-out infinite; }
      @keyframes sway { 0%, 100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="340" rx="22" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#f6f0e1">
    <circle class="twinkle" cx="330" cy="40" r="1.8"/>
    <circle class="twinkle b" cx="420" cy="78" r="1.4"/>
    <circle class="twinkle c" cx="560" cy="30" r="2"/>
    <circle class="twinkle" cx="700" cy="62" r="1.5"/>
    <circle class="twinkle b" cx="860" cy="34" r="1.9"/>
    <circle class="twinkle c" cx="980" cy="70" r="1.4"/>
    <circle class="twinkle" cx="1100" cy="42" r="1.8"/>
    <circle class="twinkle c" cx="1150" cy="110" r="1.3"/>
    <circle class="twinkle b" cx="640" cy="118" r="1.2"/>
  </g>
  <!-- Moon -->
  <circle cx="1080" cy="96" r="26" fill="#f2d06b" opacity=".95"/>
  <circle cx="1092" cy="88" r="24" fill="#1c2b4b"/>

  <!-- Compass -->
  <g>
    <circle cx="170" cy="150" r="92" fill="#1d2b4a" stroke="#2d3f66" stroke-width="6"/>
    <circle cx="170" cy="150" r="72" fill="none" stroke="#f2d06b" stroke-width="5"/>
    <g fill="#f2d06b">
      <rect x="167" y="70" width="6" height="14" rx="3"/>
      <rect x="167" y="216" width="6" height="14" rx="3"/>
      <rect x="90" y="147" width="14" height="6" rx="3"/>
      <rect x="236" y="147" width="14" height="6" rx="3"/>
    </g>
    <g class="needle">
      <path d="M170 88 L184 150 L170 212 L156 150 Z" fill="#f6f0e1"/>
      <path d="M170 88 L184 150 L156 150 Z" fill="#e2574c"/>
    </g>
    <circle cx="170" cy="150" r="9" fill="#1d2b4a" stroke="#f2d06b" stroke-width="4"/>
  </g>

  <!-- Name -->
  <text x="300" y="112" class="name">Rafael Vitor</text>
  <text x="302" y="150" class="role">Senior ServiceNow Consultant &amp; Developer</text>
  <text x="302" y="180" class="line">9+ years on the Now Platform · maker of NowTilus Academy</text>

  <!-- Ground and sea -->
  <path d="M0 290 C 200 270, 360 300, 560 286 S 900 268, 1200 288 L1200 318 Q1200 340 1178 340 L22 340 Q0 340 0 318 Z" fill="url(#sea)"/>

  <!-- Cities along the shore -->
  <!-- Aspen: mountains -->
  <g transform="translate(70 238)">
    <path d="M0 52 L34 4 L52 28 L66 12 L96 52 Z" fill="#3b5a8a"/>
    <path d="M34 4 L44 18 L38 16 L32 22 L26 15 Z" fill="#f6f0e1"/>
  </g>
  <!-- Paris: a tower -->
  <g transform="translate(300 214)" fill="#c9d3e6">
    <path d="M22 0 L26 0 L30 30 L36 76 L30 76 L24 46 L18 76 L12 76 L18 30 Z"/>
    <rect x="14" y="28" width="20" height="4" rx="2"/>
    <rect x="10" y="52" width="28" height="4" rx="2"/>
  </g>
  <!-- New York: skyline -->
  <g transform="translate(470 222)" fill="#8fa3c8">
    <rect x="0" y="34" width="18" height="40"/>
    <rect x="22" y="10" width="20" height="64"/>
    <rect x="29" y="0" width="6" height="12"/>
    <rect x="46" y="26" width="16" height="48"/>
    <rect x="66" y="42" width="14" height="32"/>
    <g fill="#f2d06b"><rect x="27" y="22" width="4" height="4"/><rect x="33" y="34" width="4" height="4"/><rect x="50" y="38" width="4" height="4"/><rect x="5" y="44" width="4" height="4"/></g>
  </g>
  <!-- Tokyo: a pagoda -->
  <g transform="translate(700 214)" fill="#e2574c">
    <path d="M6 22 L50 22 L42 14 L14 14 Z"/>
    <rect x="16" y="22" width="24" height="14" fill="#b84f1e"/>
    <path d="M2 44 L54 44 L46 36 L10 36 Z"/>
    <rect x="14" y="44" width="28" height="16" fill="#b84f1e"/>
    <path d="M-2 68 L58 68 L50 60 L6 60 Z"/>
    <rect x="12" y="68" width="32" height="12" fill="#b84f1e"/>
    <rect x="26" y="2" width="4" height="14"/>
  </g>
  <!-- Sydney: sails -->
  <g transform="translate(890 246)" fill="#f6f0e1">
    <path d="M0 40 Q14 0 34 40 Z"/>
    <path d="M22 40 Q40 6 58 40 Z" opacity=".9"/>
    <path d="M46 40 Q62 14 76 40 Z" opacity=".8"/>
  </g>
  <!-- Rio: a hill by the sea -->
  <g transform="translate(1040 224)">
    <path d="M0 62 Q10 30 30 22 Q44 18 50 62 Z" fill="#3b5a8a"/>
    <path d="M40 62 Q56 6 74 8 Q86 12 96 62 Z" fill="#4a6ba0"/>
    <path d="M30 24 L72 10" stroke="#c9d3e6" stroke-width="1.5"/>
    <rect x="49" y="15" width="7" height="5" rx="1.5" fill="#f2d06b"/>
  </g>

  <!-- The route -->
  <path id="route" d="M110 240 C 220 206, 280 252, 324 212 S 470 210, 512 220 S 660 200, 728 212 S 860 236, 928 244 S 1040 210, 1086 224"
        fill="none" stroke="#f2d06b" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g fill="#f2d06b">
    <circle cx="110" cy="240" r="6"/><circle cx="324" cy="212" r="6"/><circle cx="512" cy="220" r="6"/>
    <circle cx="728" cy="212" r="6"/><circle cx="928" cy="244" r="6"/><circle cx="1086" cy="224" r="6"/>
  </g>

  <!-- The plane, flying the route -->
  <g class="plane" style="offset-path: path('M110 240 C 220 206, 280 252, 324 212 S 470 210, 512 220 S 660 200, 728 212 S 860 236, 928 244 S 1040 210, 1086 224'); offset-rotate: auto;">
    <path d="M-12 0 L10 -2 L14 0 L10 2 Z M-2 -1 L-8 -9 L-4 -9 L4 -1 Z M-2 1 L-8 9 L-4 9 L4 1 Z M-12 -1 L-15 -5 L-12 -5 L-9 -1 Z M-12 1 L-15 5 L-12 5 L-9 1 Z" fill="#f6f0e1"/>
  </g>
</svg>
